[project]
name = "zv67"
version = "0.1.0"
description = "ZV67 local gateway for Google AI Mode with an OpenAI-compatible API"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "cryptography>=43",
    "fastapi>=0.115",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zv67"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

